[plugins]
krew = "https://github.com/soupglasses/mise-krew.git#2.0.0"

# File synced from https://github.com/FasterSpeeding/Aurora-Fauxy
# Changes will not be persisted
[tools]
# Languages
go = "1.26.3"
python = "3"
rust = { version = "1.95.0", components = "rustc,cargo" }
# CLI tools
cargo-binstall = "1.19.1"
chezmoi = "2.70.3"
flux2 = "2.8.7"
git-lfs = "3.7.1"
"go:github.com/schollz/croc/v10" = "v10.4.3"
helm = "4.2.3"
"krew:tree" = "0.6.0"
# "krew:neat" = "2.0.4"
kubeconform = "0.7.0"
kustomize = "5.8.1"
uv = "0.11.14"
just = "1.51.0"
kubeseal = "0.36.6"
minikube = "1.38.1"
opentofu = "1.12.0"
"pipx:kseal" = "2.1.1"
"pipx:yt-dlp" = "2026.6.9"

[settings]
activate_aggressive = true
experimental = true
gpg_verify = true
lockfile = false
not_found_auto_install = false
paranoid = true
plugin_autoupdate_last_check_duration = "0"
go_skip_checksum = true

[settings.python]
compile = false
